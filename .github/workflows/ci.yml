name: CI

on:
  pull_request:
  push:
    branches: [main, trunk]

jobs:
  lint-type-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.9.8"

      - name: Sync dependencies
        run: uv sync --all-groups --all-extras

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Typecheck (mypy, strict on graph/guard/llm)
        run: uv run mypy continuum

      - name: Unit tests
        run: uv run pytest -m "not integration"

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: continuum
          POSTGRES_USER: continuum
          POSTGRES_PASSWORD: continuum_ci
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U continuum -d continuum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433
      POSTGRES_DB: continuum
      POSTGRES_USER: continuum
      POSTGRES_PASSWORD: continuum_ci
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      DATA_SEED: "20260101"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.9.8"

      - name: Sync dependencies
        run: uv sync --all-groups --all-extras

      - name: Enable required Postgres extensions
        run: |
          PGPASSWORD=continuum_ci psql -h localhost -p 5433 -U continuum -d continuum \
            -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Integration tests
        run: uv run pytest -m integration

  # Reserved for Phase 7: CI fails on regression in any of the three headline metrics
  # (screening precision at 100% recall, incremental recovery vs. baseline, entity-view
  # lift share). Not implemented until the evaluation harness exists.
  # metrics-gate:
  #   runs-on: ubuntu-latest
  #   steps: []
