<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Review queue{% endblock %} · CONTINUUM</title>
  <style>
    :root { --ink:#1b1f24; --muted:#5b6570; --line:#d8dde3; --bg:#f6f7f9; --card:#fff;
            --block:#a4262c; --warn:#8a5a00; --ok:#1e6b3a; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 system-ui, sans-serif; color:var(--ink); background:var(--bg); }
    header { display:flex; justify-content:space-between; padding:12px 24px; background:var(--card);
             border-bottom:1px solid var(--line); }
    header a { color:inherit; text-decoration:none; font-weight:600; }
    main { max-width:1000px; margin:24px auto; padding:0 24px; }
    h1 { font-size:20px; margin:0 0 16px; }
    h2 { font-size:15px; margin:0 0 8px; }
    h3 { font-size:13px; margin:0 0 4px; color:var(--muted); }
    section { background:var(--card); border:1px solid var(--line); border-radius:6px;
              padding:16px; margin-bottom:16px; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); }
    th { font-size:12px; text-transform:uppercase; color:var(--muted); }
    td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
    code { font-size:13px; }
    .muted { color:var(--muted); }
    .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px;
           border:1px solid currentColor; }
    .tag.block, .tag.hit { color:var(--block); }
    .tag.escalate, .tag.unresolved { color:var(--warn); }
    .tag.clear { color:var(--ok); }
    pre { white-space:pre-wrap; margin:0; padding:12px; background:var(--bg); border-radius:4px; }
    form.decision { display:flex; gap:8px; }
    button { font:inherit; padding:8px 16px; border-radius:4px; border:1px solid var(--line);
             background:var(--card); cursor:pointer; }
    button.approve { background:var(--ok); border-color:var(--ok); color:#fff; }
    nav a { margin-right:16px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:0 16px; }
    .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px;
             margin-bottom:12px; }
    .tile strong { display:block; font-size:22px; font-variant-numeric:tabular-nums; }
  </style>
</head>
<body>
  <header><nav><a href="/dashboard">CONTINUUM</a><a href="/dashboard">Dashboard</a><a href="/reviews">Review queue</a></nav><span class="muted">{{ reviewer }}</span></header>
  <main>{% block main %}{% endblock %}</main>
</body>
</html>
